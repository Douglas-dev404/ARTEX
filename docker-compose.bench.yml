# Imagem de avaliação ARTEX Tencent TSec Benchmark — build + run local com um comando.
# Independente do docker-compose.yml usado em produção (multisserviço: artex+postgres).
# Uso:
#   cp bench/.env.example bench/.env   # preencha LLM_API_KEY / BENCHMARK_TOKEN etc.
#   docker compose -f docker-compose.bench.yml up --build      # build e execução em primeiro plano (vê os logs)
#   docker compose -f docker-compose.bench.yml up --build -d   # em segundo plano
#   docker compose -f docker-compose.bench.yml logs -f
#   docker compose -f docker-compose.bench.yml down            # para (com -v apaga também os volumes de dados)
# Navegador: http://localhost:8787 (entre com ADMIN_PASSWORD)

services:
  artex-bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    image: artex-bench:latest
    container_name: artex-bench
    env_file:
      - bench/.env
    # Compartilha a rede com a máquina física: o contêiner usa direto a pilha de rede do host e acessa a rede dos alvos no host/VPN.
    # No modo host não se usa mapeamento de ports, o contêiner liga direto nas portas do host: 8787 (UI/API), 8788 (proxy)
    # e o PostgreSQL interno 5432 — garanta que essas três portas do host estejam livres (antes do teste local, pare os serviços que as ocupam).
    network_mode: host
    restart: "no"

volumes:
  artex_bench_data:
